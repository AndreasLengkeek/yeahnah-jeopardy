services:
  - type: web
    name: yeahnah-jeopardy
    runtime: node
    plan: free
    # Closest Render region to NZ/Australia
    region: singapore
    numInstances: 1
    buildCommand: npm ci --omit=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    branch: main
    # Deploys are manual: a deploy restarts the server and ends every live Room, so a
    # merge mustn't trigger one on game night (ADR-0015).
    autoDeployTrigger: off
    envVars:
      # Secret: Render prompts for the value when the Blueprint is first created.
      # Never commit it here.
      - key: ROOM_PASSCODE
        sync: false

# Render Blueprint: the whole app as one free-tier Node web service (ADR-0014).
# Setup, the Host Passcode, and what sleeping/redeploys mean for a live Game:
# docs/deploy.md. Spec: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: yeahnah-jeopardy
    runtime: node
    plan: free
    # Closest Render region to NZ/Australia; buzz fairness depends on latency (ADR-0003).
    region: singapore
    # Exactly one instance: the Game lives in this process's memory.
    numInstances: 1
    # Vite and its React plugin are runtime dependencies, so a production-only install
    # is enough to build the client and run the server.
    buildCommand: npm ci --omit=dev && npm run build
    # Root `npm start` runs the server workspace's start script: tsx, serving client/dist.
    startCommand: npm start
    healthCheckPath: /health
    branch: main
    autoDeployTrigger: commit
    # Node version comes from .node-version at the repo root.
    envVars:
      # Secret: Render prompts for the value when the Blueprint is first created.
      # Never commit it here.
      - key: HOST_PASSCODE
        sync: false
